# 打包流水线：打「主程序包」（代码 + 界面/推理依赖 + LaMa 修复模型）。
#
# 触发：推 main、打 v* 标签、或手动 Actions → 打包 → Run workflow。
# 产物：Actions 运行页底部的 Artifacts（dewatermark-windows），解压后补上
#       即完整可运行自动识别（OCR 模型随依赖在包内）；只有「提示词定位」
#       需要再叠加「去水印底座包」（tools/build_runtime_base.py 一次性打好，
#       见 docs/底座包打包说明.md）。
#
# 说明：
# - LaMa 模型不入库：流水线从 HuggingFace 下载到 models/（有缓存），
#   打包脚本将它收进产物 models/ 目录。
# - 打包后跑 --smoke 离屏自检（QT_QPA_PLATFORM=offscreen），冒烟图现场生成。
# - 产物保留 7 天（带模型后单包 ~400MB，默认 90 天会顶爆免费配额；
#   要长期留存请下载后自行归档）。
# - 单元测试不在本流水线跑：当前有 2 个既有失败（干净 HEAD 同样失败），
#   测试关口在本地 ./start.sh test 体系，避免 CI 常红掩盖真问题。

name: 打包

env:
  PYTHONUTF8: "1"   # Windows runner 默认 cp1252，打印/读写中文路径会崩，全程 UTF-8

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dewatermark-windows
            windowed: "--windowed"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 缓存 LaMa 模型
        uses: actions/cache@v4
        with:
          path: models/inpainting_lama_2025jan.onnx
          key: lama-inpainting-2025jan

      - name: 下载 LaMa 模型（缓存未命中时）
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download("opencv/inpainting_lama", "inpainting_lama_2025jan.onnx",
                              local_dir="models")
          print("model at", p)
          PY

      - name: PyInstaller 打包（主程序包，含 LaMa 模型）
        run: python tools/package_app.py --clean ${{ matrix.windowed }}

      - name: 生成冒烟测试图
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (800, 600), (245, 243, 238))
          d = ImageDraw.Draw(img)
          for y in range(80, 560, 46):          # 仿正文行
              d.rectangle([60, y, 740, y + 14], fill=(60, 60, 60))
          for x in range(-200, 900, 260):      # 仿淡水印
              d.text((x, 300), "WATERMARK", fill=(215, 212, 205))
          img.save("smoke_input.png")
          print("smoke_input.png written")
          PY

      - name: 冒烟自检（离屏，不弹窗）
        shell: bash
        timeout-minutes: 8   # windowed exe 启动失败会弹不可见对话框干等，超时杀黔防拖满整个 job
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: "1"
          WM_LAMA_ONNX: ${{ github.workspace }}/models/inpainting_lama_2025jan.onnx
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/去水印/去水印.exe --smoke smoke_input.png
          else
            ./dist/去水印/去水印 --smoke smoke_input.png
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/去水印/
          compression-level: 6
          retention-days: 7
