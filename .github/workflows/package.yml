# 打包流水线：只打「主程序包」（代码 + 界面/推理依赖，不含模型）。
#
# 触发：推 main、打 v* 标签、或手动 Actions → 打包 → Run workflow。
# 产物：Actions 运行页底部的 Artifacts（dewatermark-windows），是不变的
#       「去水印底座包」（模型 + 便携 Python 环境，由 tools/build_runtime_base.py
#       在 GPU 机器上一次性打好，见 docs/底座包打包说明.md）之上的更新包：
#       收件人首次拿底座+主程序两个 zip 解压到同一目录；以后更新只发本包覆盖。
#
# 说明：
# - LaMa 模型不入库也不进本产物，但冒烟自检需要它：流水线从 HuggingFace
#   下载到 models/（有缓存），冒烟时通过 WM_LAMA_ONNX 指给程序。
# - 打包后跑 --smoke 离屏自检（QT_QPA_PLATFORM=offscreen），冒烟图现场生成。
# - 单元测试不在本流水线跑：当前有 2 个既有失败（干净 HEAD 同样失败），
#   测试关口在本地 ./start.sh test 体系，避免 CI 常红掩盖真问题。

name: 打包

env:
  PYTHONUTF8: "1"   # Windows runner 默认 cp1252，打印/读写中文路径会崩，全程 UTF-8

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dewatermark-windows
            windowed: "--windowed"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 缓存 LaMa 模型
        uses: actions/cache@v4
        with:
          path: models/inpainting_lama_2025jan.onnx
          key: lama-inpainting-2025jan

      - name: 下载 LaMa 模型（缓存未命中时）
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download("opencv/inpainting_lama", "inpainting_lama_2025jan.onnx",
                              local_dir="models")
          print("model at", p)
          PY

      - name: PyInstaller 打包（主程序包，不含模型）
        run: python tools/package_app.py --clean --no-models ${{ matrix.windowed }}

      - name: 生成冒烟测试图
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (800, 600), (245, 243, 238))
          d = ImageDraw.Draw(img)
          for y in range(80, 560, 46):          # 仿正文行
              d.rectangle([60, y, 740, y + 14], fill=(60, 60, 60))
          for x in range(-200, 900, 260):      # 仿淡水印
              d.text((x, 300), "WATERMARK", fill=(215, 212, 205))
          img.save("smoke_input.png")
          print("smoke_input.png written")
          PY

      - name: 冒烟自检（离屏，不弹窗）
        shell: bash
        timeout-minutes: 8   # windowed exe 启动失败会弹不可见对话框干等，超时杀黔防拖满整个 job
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: "1"
          WM_LAMA_ONNX: ${{ github.workspace }}/models/inpainting_lama_2025jan.onnx
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/去水印/去水印.exe --smoke smoke_input.png
          else
            ./dist/去水印/去水印 --smoke smoke_input.png
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/去水印/
          compression-level: 6
