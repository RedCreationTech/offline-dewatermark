<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{--ink:#213b34;--muted:#62716d;--line:#dce4df;--bg:#f4f6f4;--good:#176c4d;--review:#91621e;--poor:#aa443f;--info:#2563eb}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{max-width:1380px;margin:auto;padding:32px 30px 60px}
a{color:var(--good);text-underline-offset:3px}
h1{font-size:31px;line-height:1.35;margin:17px 0 9px}
h2{font-size:22px;line-height:1.4;margin:24px 0 12px;color:var(--ink)}
h3{font-size:17px;line-height:1.45;margin:18px 0 9px}
.byline{font-size:13px;color:var(--muted);margin:0}
.intro{max-width:1000px;color:var(--muted);margin:14px 0 20px}
.back{font-size:13px;display:inline-block;margin-bottom:12px}
.notice{padding:12px 16px;border-left:3px solid #bb8f4a;background:#fffaf0;font-size:13px;margin:18px 0}
.notice.info{border-color:var(--info);background:#eff6ff}
.notice.good{border-color:var(--good);background:#f0fdf4}
.notice.poor{border-color:var(--poor);background:#fef2f2}
.cards{display:grid;gap:17px;margin:20px 0}
.cards.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card h3{margin-top:0}
.stat{font-size:36px;font-weight:700;line-height:1.2;margin:8px 0}
.stat.good{color:var(--good)}
.stat.review{color:var(--review)}
.stat.poor{color:var(--poor)}
.stat-label{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#f8faf8;font-weight:600;color:var(--ink)}
.badge{display:inline-block;padding:3px 9px;font-size:12px;border-radius:5px;font-weight:500}
.badge.good{background:#edf4ef;color:var(--good)}
.badge.review{background:#fef3e2;color:var(--review)}
.badge.poor{background:#fde8e7;color:var(--poor)}
.badge.info{background:#e0f2fe;color:var(--info)}
.section{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:20px 0}
details{margin:12px 0}
summary{cursor:pointer;color:var(--good);font-weight:500;padding:6px 0}
summary:hover{color:#14532d}
footer{font-size:12px;color:var(--muted);margin-top:30px;padding-top:15px;border-top:1px solid var(--line)}
@media(max-width:760px){.shell{padding:20px 14px}h1{font-size:25px}.cards.cols-2,.cards.cols-3{grid-template-columns:1fr}}
</style></head><body><main class="shell">
__CONTENT__
<footer>__FOOTER__</footer>
</main>
<script id="report-data" type="application/json">__DATA__</script>
</body></html>
